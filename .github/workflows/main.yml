# NewsFlow — RSS 新闻采集、词频分析、企业微信日报推送
# 文档: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: NewsFlow Daily

on:
  workflow_dispatch:   # 允许手动触发
  push:
    branches:
      - main
  schedule:
    # 北京时间每天 08:00、12:00、20:00（GitHub Actions 使用 UTC）
    - cron: "0 0 * * *"   # 08:00 CST
    - cron: "0 4 * * *"   # 12:00 CST
    - cron: "0 12 * * *"  # 20:00 CST

concurrency:
  group: newsflow-main
  cancel-in-progress: false

permissions:
  actions: write
  checks: write
  contents: write   # 需要 write 权限以提交 news.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline tests
        run: python -m pytest -q

      - name: Run NewsFlow
        env:
          WEBHOOK_KEY: ${{ secrets.WEBHOOK_KEY }}
          KEYWORDS: ${{ secrets.KEYWORDS }}
          CAIYUN_API_KEY: ${{ secrets.CAIYUN_API_KEY }}
          WEATHER_COORDS: ${{ vars.WEATHER_COORDS }}
        run: python3 ./Src/main.py

      - name: Commit data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data public/data public/js/news-data.js public/js/news-archive-data.js public/js/weather-data.js
          git diff --cached --quiet || git commit -m "chore: update news data [skip ci]"
          # A manual run and a scheduled/push run can overlap. Rebase generated
          # data on the latest main before pushing to avoid a stale-ref rejection.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Rebase failed; generated data conflicts with a newer main commit." >&2
              exit 1
            fi
            echo "Push attempt $attempt failed; retrying..." >&2
            sleep $((attempt * 2))
          done
          echo "Unable to push generated data after 3 attempts." >&2
          exit 1



