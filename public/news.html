<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="NewsFlow RSS 新闻聚合阅读页，按主题浏览来自多个订阅源的最新文章。">
  <title>新闻聚合 · NewsFlow</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--panel:#111a2d;--panel2:#162239;--text:#edf3ff;--muted:#8b9bb7;--line:rgba(164,184,219,.15);--accent:#82b7ff;--accent2:#a9e0d4;--shadow:0 18px 60px rgba(0,0,0,.2)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,rgba(61,102,176,.19),transparent 42%),var(--bg);color:var(--text);font:15px/1.65 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    a{color:inherit}.shell{width:min(1180px,calc(100% - 40px));margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;padding:24px 0;border-bottom:1px solid var(--line)}.brand{display:flex;gap:12px;align-items:center;text-decoration:none;font-weight:750;letter-spacing:.02em}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,#8bc3ff,#a8e3d7);color:#0b1830;font-weight:900}.toplinks{display:flex;gap:18px;color:var(--muted);font-size:13px}.toplinks a{text-decoration:none}.toplinks a:hover{color:var(--text)}
    .hero{padding:54px 0 30px;display:grid;grid-template-columns:1.4fr .6fr;gap:28px;align-items:end}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent2);font-weight:800}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.08;letter-spacing:-.045em;margin:12px 0 16px}.hero p{max-width:620px;color:var(--muted);margin:0}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{padding:17px 18px;border:1px solid var(--line);border-radius:17px;background:rgba(17,26,45,.72)}.metric strong{display:block;font-size:27px;letter-spacing:-.04em}.metric span{font-size:12px;color:var(--muted)}
    .toolbar{display:flex;gap:10px;align-items:center;margin:22px 0 14px}.search{flex:1;position:relative}.search input{width:100%;padding:13px 15px 13px 43px;background:var(--panel);border:1px solid var(--line);border-radius:13px;color:var(--text);outline:none;font:inherit}.search input:focus{border-color:var(--accent)}.search:before{content:"⌕";position:absolute;left:15px;top:5px;font-size:25px;color:var(--muted)}select,.refresh{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit}.refresh{cursor:pointer}.refresh:hover{border-color:var(--accent)}
    .categories{display:flex;gap:8px;overflow:auto;padding:5px 0 16px;scrollbar-width:thin}.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:7px 13px;background:transparent;color:var(--muted);font:inherit;font-size:12px;cursor:pointer}.chip:hover,.chip.active{background:rgba(130,183,255,.13);border-color:rgba(130,183,255,.55);color:var(--text)}.section-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 15px}.section-head h2{font-size:17px;margin:0}.section-head span{font-size:12px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{display:flex;flex-direction:column;min-height:190px;padding:19px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(155deg,rgba(22,34,57,.92),rgba(15,23,41,.92));text-decoration:none;transition:transform .18s,border-color .18s,background .18s;box-shadow:var(--shadow)}.card:hover{transform:translateY(-3px);border-color:rgba(130,183,255,.55);background:var(--panel2)}.card-top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:13px}.tag{display:inline-flex;max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 8px;border-radius:7px;background:rgba(130,183,255,.1);color:var(--accent);font-size:10px;font-weight:750}.source{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card h3{font-size:16px;line-height:1.55;letter-spacing:-.01em;margin:0 0 20px;font-weight:650;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.read{color:var(--accent2)}.empty{grid-column:1/-1;text-align:center;padding:60px 20px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.status{margin:15px 0;color:var(--muted);font-size:12px}.footer{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);margin-top:48px;padding:22px 0 32px;color:var(--muted);font-size:12px}.footer a{color:var(--accent);text-decoration:none}
    @media(max-width:850px){.hero{grid-template-columns:1fr;padding-top:38px}.metrics{max-width:420px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.shell{width:min(100% - 24px,1180px)}.topbar{padding:17px 0}.toplinks{gap:10px}.hero h1{font-size:39px}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.grid{grid-template-columns:1fr}.card{min-height:155px}.footer{flex-direction:column}.metrics{gap:8px}.metric{padding:13px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header class="shell topbar">
    <a class="brand" href="./index.html"><span class="mark">N</span><span>NEWSFLOW <span style="color:var(--muted);font-weight:450">/ DAILY</span></span></a>
    <nav class="toplinks"><a href="./index.html">数据看板</a><a href="https://github.com/ilikui/Dailly" target="_blank" rel="noopener noreferrer">项目仓库 ↗</a></nav>
  </header>
  <main class="shell">
    <section class="hero">
      <div><div class="eyebrow">Read beyond the feed</div><h1>把信息流，<br>变成自己的视野。</h1><p>聚合多个 RSS / Atom / JSON Feed 来源。按主题发现内容，用搜索缩小范围，点击卡片阅读原文。</p></div>
      <div class="metrics"><div class="metric"><strong id="totalCount">—</strong><span>可浏览文章</span></div><div class="metric"><strong id="sourceCount">—</strong><span>内容来源</span></div></div>
    </section>
    <section aria-label="新闻筛选">
      <div class="toolbar"><label class="search"><input id="searchInput" type="search" placeholder="搜索标题或来源…" autocomplete="off" aria-label="搜索标题或来源"></label><select id="sortSelect" aria-label="排序方式"><option value="source">按来源分组</option><option value="title">按标题排序</option></select><button class="refresh" id="refreshBtn" type="button">重新加载</button></div>
      <div class="categories" id="categories" aria-label="新闻分类"></div>
      <div class="section-head"><h2 id="sectionTitle">全部文章</h2><span id="resultCount"></span></div>
      <div class="grid" id="newsGrid" aria-live="polite"><div class="empty">正在加载新闻数据…</div></div>
      <div class="status" id="statusText"></div>
    </section>
  </main>
  <footer class="shell footer"><span>NewsFlow Daily · 由 RSS 自动聚合</span><span>文章版权归原发布方所有。<a href="https://github.com/ilikui/Dailly">查看项目与数据源 ↗</a></span></footer>
  <script src="./js/news-data.js"></script>
  <script>
    (function () {
      'use strict';
      var allItems = [];
      var activeCategory = '全部';
      var grid = document.getElementById('newsGrid');
      var categoriesEl = document.getElementById('categories');
      var searchInput = document.getElementById('searchInput');
      var sortSelect = document.getElementById('sortSelect');
      var totalCount = document.getElementById('totalCount');
      var sourceCount = document.getElementById('sourceCount');
      var resultCount = document.getElementById('resultCount');
      var sectionTitle = document.getElementById('sectionTitle');
      var statusText = document.getElementById('statusText');

      function safeUrl(value) {
        try { var u = new URL(value, window.location.href); return /^https?:$/.test(u.protocol) ? u.href : ''; }
        catch (_) { return ''; }
      }
      function text(tag, value, className) {
        var el = document.createElement(tag);
        if (className) el.className = className;
        el.textContent = value || '';
        return el;
      }
      function normalize(raw) {
        return (Array.isArray(raw) ? raw : []).filter(function (item) {
          return item && typeof item.title === 'string' && item.title.trim() && safeUrl(item.url);
        }).map(function (item) {
          return { title: item.title.trim(), url: safeUrl(item.url), type: item.type || '其它', source: item.source || '未知来源' };
        });
      }
      function renderCategories() {
        var counts = {'全部': allItems.length};
        allItems.forEach(function (item) { counts[item.type] = (counts[item.type] || 0) + 1; });
        categoriesEl.replaceChildren();
        Object.keys(counts).sort(function (a,b) { if (a === '全部') return -1; if (b === '全部') return 1; return a.localeCompare(b, 'zh-CN'); }).forEach(function (name) {
          var btn = text('button', name + ' · ' + counts[name], 'chip' + (name === activeCategory ? ' active' : ''));
          btn.type = 'button';
          btn.setAttribute('aria-pressed', String(name === activeCategory));
          btn.addEventListener('click', function () { activeCategory = name; renderCategories(); renderNews(); });
          categoriesEl.appendChild(btn);
        });
      }
      function renderNews() {
        var query = searchInput.value.trim().toLocaleLowerCase();
        var items = allItems.filter(function (item) {
          var matchesCategory = activeCategory === '全部' || item.type === activeCategory;
          var matchesQuery = !query || (item.title + ' ' + item.source + ' ' + item.type).toLocaleLowerCase().indexOf(query) >= 0;
          return matchesCategory && matchesQuery;
        });
        if (sortSelect.value === 'title') items.sort(function (a,b) { return a.title.localeCompare(b.title, 'zh-CN'); });
        else items.sort(function (a,b) { return a.source.localeCompare(b.source, 'zh-CN') || a.title.localeCompare(b.title, 'zh-CN'); });
        sectionTitle.textContent = activeCategory === '全部' ? '全部文章' : activeCategory;
        resultCount.textContent = '显示 ' + items.length + ' / ' + allItems.length + ' 篇';
        grid.replaceChildren();
        if (!items.length) {
          grid.appendChild(text('div', allItems.length ? '没有找到匹配内容，试试其他关键词或分类。' : '暂时没有可显示的新闻。请检查 RSS 采集工作流是否成功运行。', 'empty'));
          return;
        }
        items.forEach(function (item) {
          var card = document.createElement('a');
          card.className = 'card'; card.href = item.url; card.target = '_blank'; card.rel = 'noopener noreferrer';
          var top = document.createElement('div'); top.className = 'card-top';
          top.appendChild(text('span', item.type, 'tag'));
          top.appendChild(text('span', item.source, 'source'));
          card.appendChild(top);
          card.appendChild(text('h3', item.title));
          var foot = document.createElement('div'); foot.className = 'card-foot';
          foot.appendChild(text('span', item.source));
          foot.appendChild(text('span', '阅读原文 ↗', 'read'));
          card.appendChild(foot);
          grid.appendChild(card);
        });
      }
      function loadData() {
        var raw = window.NEWSFLOW_NEWS;
        if (!Array.isArray(raw)) {
          statusText.textContent = '新闻数据文件未加载。请确认 public/js/news-data.js 已生成并发布。';
          allItems = [];
        } else {
          allItems = normalize(raw);
          statusText.textContent = '数据由 GitHub Actions 定时更新；文章链接指向原始发布网站。';
        }
        totalCount.textContent = allItems.length.toLocaleString();
        sourceCount.textContent = new Set(allItems.map(function (item) { return item.source; })).size.toLocaleString();
        renderCategories(); renderNews();
      }
      searchInput.addEventListener('input', renderNews);
      sortSelect.addEventListener('change', renderNews);
      document.getElementById('refreshBtn').addEventListener('click', function () { window.location.reload(); });
      loadData();
    }());
  </script>
</body>
</html>
